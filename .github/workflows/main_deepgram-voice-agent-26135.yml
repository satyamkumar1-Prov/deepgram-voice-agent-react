name: Build and deploy Node.js app to Azure Web App - deepgram-voice-agent-26135

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Build React App
        run: npm run build
        env:
          VITE_DEEPGRAM_API_KEY: ${{ secrets.VITE_DEEPGRAM_API_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: react-build
          path: dist

      - uses: azure/webapps-deploy@v3
        with:
          app-name: deepgram-voice-agent-26135
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CDFBE8094347472FA6B36BD5C481757A }}
          package: dist
